name: Dashboard deploy
on:
  push:
    # Both branches deploy to the same gh-pages target; last push wins.
    # If branch-specific preview URLs are needed later, switch to a
    # destination_dir scheme per branch.
    branches: [main, dashboarding]
    paths: ['dashboard/**', 'mondo-usage-dashboard/**', '.github/workflows/dashboard.yml']
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: Test
        working-directory: dashboard
        run: npx vitest run
      - name: Build
        working-directory: dashboard
        env: { VITE_BASE: /CHARMPheno/ }
        run: npm run build
      - name: Add Mondo-usage dashboard (static, served at /mondo-aou-usage/)
        run: |
          mkdir -p dashboard/dist/mondo-aou-usage
          cp mondo-usage-dashboard/index.html dashboard/dist/mondo-aou-usage/
          cp mondo-usage-dashboard/mondo_usage.json dashboard/dist/mondo-aou-usage/
          cp mondo-usage-dashboard/mondo_usage.sample.json dashboard/dist/mondo-aou-usage/
          # HPO phenotype axis: ships WITH the Mondo payload — the dual-axis Mondo payload
          # has phenotype terms removed, so it is only coherent alongside hpo_usage.json.
          cp mondo-usage-dashboard/hpo_usage.json dashboard/dist/mondo-aou-usage/
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dashboard/dist
          publish_branch: gh-pages
          # Replace gh-pages with a single fresh commit each deploy. The dashboard
          # ships multi-MB binary payloads (mondo_usage.json); keeping full history
          # bloats the pack every push and GitHub eventually rejects it with
          # "remote: fatal error in commit_refs". Pages only needs the latest tree.
          force_orphan: true
