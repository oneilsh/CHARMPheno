# Cross-cohort defaults for experiment-tracking system.
# Layered as: _base.yaml -> <cohort>.yaml -> per-experiment frontmatter overrides.
# The cluster writes the effective (merged) config into summary.md at fit time
# so changes here do not retroactively affect already-run experiments.
model_class: lda
source_table: condition_era
doc_unit: patient_year
doc_min_length: 20
K: 40
max_iter: 20
vocab_size: 10000
min_df: 20
min_patient_count: 20
# Prior-observation lookback (days) for cohort index dates. 365 requires a
# year of pre-index coverage (excludes prevalent cases); 0 drops the lookback.
# No effect on the unfiltered "general" cohort. Keys the corpus + covariate
# caches, so changing it forces a rebuild.
prior_obs_days: 365
subsampling_rate: 0.2
tau0: 64
kappa: 0.7
save_interval: 5
print_topics_every: 1
person_mod: 10
top_n_tokens: 6
seed: 42
optimize_doc_concentration: true
optimize_topic_concentration: false
# Dashboard-build defaults (used by --build-only / make build-dashboard-exp).
# Match build_dashboard_cloud.py's argparse defaults; override per-experiment
# in frontmatter to dial bundle size or NPMI sample size.
vocab_top_n: 5000
top_n_codes_for_npmi: 20

# --- STM (prevalence-only) defaults ---
# model_class: stm in the experiment frontmatter triggers the STM path.
# covariate_formula, categorical_cols, continuous_cols are REQUIRED in
# frontmatter when model_class: stm; no sensible default exists.
# STM uses random_seed (not 'seed'); null = nondeterministic, set in
# experiment frontmatter for reproducibility.
random_seed: null
sigma_init: 1.0
sigma_ridge: 1.0e-6
lbfgs_max_iter: 50
lbfgs_tol: 1.0e-4

# --- dag_placement (hierarchical case-finding) defaults ---
# model_class: dag_placement triggers the gated-SVI placement engine. K is
# EMERGENT (n_bg + surviving-DAG-nodes * tpn), NOT set here. init=random is the
# validated default; init=spectral is the pre-registered A/B arm (dense
# block-aligned anchor-word seed, Arora et al. 2013). `disease` selects both the
# foreground cohort and the label-DAG anchors (cohorts.disease_anchors):
# 'diabetes'/'eds' root at one anchor; 'rare6' builds a six-disease forest.
disease: diabetes
min_n: 50
n_bg: 20
tpn: 5
holdout_frac: 0.2
window_days: 365
# window_mode=forward: existing single-window behavior (unchanged default).
# window_mode=lookback: pre-index feature frame (lookback_days back from an
# index date) + forward label frame (label_window_days), leakage-free by
# construction (see exps 0061/0062).
window_mode: forward
lookback_days: 365
label_window_days: 365
init: random
spectral_max_vocab: 8000
spectral_method: auto      # auto|dense|scalable; auto routes by vocab vs spectral_max_vocab
anchor_scope: closure      # closure|frontier; frontier = bg/node anchors from only their own docs
cavi_max_iter: 100
cavi_tol: 1.0e-3
strip_mode: test_only
# node_alpha_scale multiplies the per-node-topic Dirichlet alpha vs the background
# alpha (1/K). 1.0 = symmetric (default); <1 = block-asymmetric prior (Wallach et
# al. 2009) that down-weights disease-node topics so background docs stay on the
# background block at ungated transform time.
node_alpha_scale: 1.0
# SVI optimizer schedule. mini_batch_fraction 0.1 = sample 10% of the corpus per
# iteration (mini-batch SVI, Hoffman et al. 2013) — this is what makes the
# decaying Robbins-Monro step size legitimate; a decaying step over full batches
# stalls before convergence. learning_rate_tau0 10 (vs the aggressive default 1)
# is a gentler slow-start: it tames the large early steps (rho_1 0.62 -> 0.19)
# that noisy early mini-batches would otherwise over-trust. kappa 0.7 = the
# standard text-corpus decay. NOTE: with mini-batching the per-iteration ELBO is
# a noisy 10% estimate, so the relative-ELBO early stop is unreliable — max_iter
# is effectively the budget; size it for enough epochs (max_iter * fraction).
mini_batch_fraction: 0.1
learning_rate_tau0: 10.0
learning_rate_kappa: 0.7
