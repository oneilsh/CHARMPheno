[tool.poetry]
name = "spark-vi"
version = "0.1.0"
description = "PySpark-native framework for distributed variational inference"
authors = ["CHARMPheno contributors"]
license = "MIT"
readme = "README.md"
packages = [{include = "spark_vi"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pyspark = ">=3.5,<4.0"
numpy = ">=1.24"
scipy = ">=1.10"
formulaic = {version = ">=1.0", optional = true}

[tool.poetry.extras]
formula = ["formulaic"]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
build = ">=1.0"
pandas = ">=2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    # `slow` is deselected by default (see addopts below). Measured 2026-07-29:
    # the @slow tier is ~82% of total runtime (10 tests were 874s of 1071s) while
    # being the LEAST sensitive to routine edits -- these pin settled math, so they
    # break on semantic regressions in a refactor rather than on day-to-day change.
    # That makes them a MERGE gate, not a dev-loop gate: run `make test-all` at
    # branch-merge / walkthrough time. Marking a test @slow is a deliberate trade
    # (it leaves the default loop), so keep cheap unit coverage of the same code
    # path in the fast tier.
    "slow: recovery / oracle-equivalence / end-to-end gate on simulator data (local Spark, minutes-scale); run via `make test-all` at merge/walkthrough time",
    "cluster: tests that require a real Dataproc cluster (manual only)",
]
addopts = "-m 'not slow and not cluster'"
filterwarnings = [
    "ignore::ResourceWarning",
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
]
