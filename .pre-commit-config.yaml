repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
        # the Mondo-usage dashboard ships its (aggregated, small-cell-suppressed)
        # payloads (Mondo + HPO axes) as static JSON for GitHub Pages; they exceed 1 MB by design.
        # The DAG topic browser's reviewed exports (dag-dashboard/published/<run>/,
        # aggregate model parameters, see each PROVENANCE.md) likewise.
        exclude: '^(mondo-usage-dashboard/(mondo|hpo)_usage\.json|dag-dashboard/published/[^/]+/(manifest|nodes|vocab|topics)\.json)$'

  - repo: local
    hooks:
      - id: no-data-files-outside-tests
        name: Prevent data files outside tests/*/data/ or docs/
        entry: scripts/check_no_data_files.sh
        language: script
        files: '\.(parquet|csv|feather|arrow|npz)$'
