<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mondo in the EHR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* ---- tokens: light is the bare :root; dark redefines tokens only ---------- */
:root{
  --bg:#f4f6f7; --surface:#ffffff; --surface-2:#eef1f3; --surface-3:#e6eaed;
  --border:#d8dee2; --border-strong:#c2cbd1;
  --ink:#171e24; --ink-2:#51606c; --muted:#8592a0;
  --accent:#00867e; --accent-ink:#ffffff;
  --cat-reported:#009e93; --cat-used-small:#c9760a; --cat-used-branch:#6a55d6; --cat-other:#9aa4b0;
  --cat-reported-soft:#009e9322; --cat-used-small-soft:#c9760a22; --cat-used-branch-soft:#6a55d622; --cat-other-soft:#9aa4b01f;
  --collision:#c0392b;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 8px 24px rgba(20,30,40,.06);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111417; --surface:#191d22; --surface-2:#20262c; --surface-3:#272e35;
  --border:#2c343c; --border-strong:#3a444d;
  --ink:#e7ecef; --ink-2:#a6b1bc; --muted:#6d7883;
  --accent:#2bb5aa; --accent-ink:#06201e;
  --cat-reported:#1fb0a4; --cat-used-small:#d59234; --cat-used-branch:#9483ea; --cat-other:#5c6672;
  --cat-reported-soft:#1fb0a422; --cat-used-small-soft:#d5923422; --cat-used-branch-soft:#9483ea24; --cat-other-soft:#5c66721f;
  --collision:#e5695b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#111417; --surface:#191d22; --surface-2:#20262c; --surface-3:#272e35;
  --border:#2c343c; --border-strong:#3a444d;
  --ink:#e7ecef; --ink-2:#a6b1bc; --muted:#6d7883;
  --accent:#2bb5aa; --accent-ink:#06201e;
  --cat-reported:#1fb0a4; --cat-used-small:#d59234; --cat-used-branch:#9483ea; --cat-other:#5c6672;
  --cat-reported-soft:#1fb0a422; --cat-used-small-soft:#d5923422; --cat-used-branch-soft:#9483ea24; --cat-other-soft:#5c66721f;
  --collision:#e5695b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--accent)}
button{font-family:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

/* ---- shell --------------------------------------------------------------- */
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 64px}
header.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;
  justify-content:space-between;padding:8px 0 18px;border-bottom:1px solid var(--border)}
.brand .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent);font-weight:600}
.brand h1{font-family:var(--serif);font-weight:600;font-size:29px;letter-spacing:-.01em;
  margin-top:3px;line-height:1.1}
.brand p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.toolbar{display:flex;gap:8px;align-items:center}
.btn{background:var(--surface);border:1px solid var(--border);color:var(--ink-2);
  border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:500;display:inline-flex;
  gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--border-strong);color:var(--ink)}
.btn svg{width:15px;height:15px}

/* ---- data-source strip --------------------------------------------------- */
.source{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:14px 0 4px;
  font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.source b{color:var(--ink-2);font-weight:500}
.badge-sample{color:var(--cat-used-small);border:1px solid var(--cat-used-small);
  border-radius:5px;padding:1px 6px;font-weight:600;letter-spacing:.04em}

/* ---- KPI row ------------------------------------------------------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 8px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:14px 15px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
  font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-value{font-family:var(--mono);font-weight:600;font-size:27px;margin-top:6px;letter-spacing:-.02em}
.kpi .k-sub{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.kpi.span2{grid-column:span 2}
@media(max-width:620px){.kpi.span2{grid-column:span 1}}

/* coverage bar */
.cover{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px;margin-top:12px;background:transparent}
.cover span{display:block;height:100%;border-radius:2px}
.cover-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:10px;font-size:11.5px;color:var(--ink-2)}
.cover-legend .li{display:flex;gap:6px;align-items:center}

/* ---- controls ------------------------------------------------------------ */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 12px;
  position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--border)}
.filters{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--border);
  background:var(--surface);border-radius:20px;padding:5px 11px 5px 9px;font-size:12.5px;
  font-weight:500;color:var(--ink-2);user-select:none}
.chip:hover{border-color:var(--border-strong)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--border-strong)}
.chip[aria-pressed="false"]{opacity:.5}
.chip .sw{width:11px;height:11px;border-radius:3px}
.chip .cnt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.grow{flex:1 1 180px}
.search{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;min-width:180px}
.search input{border:0;background:transparent;color:var(--ink);font-family:var(--sans);
  font-size:13px;outline:none;width:100%}
.search svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--ink-2);border-radius:6px;
  padding:6px 13px;font-size:12.5px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---- panels -------------------------------------------------------------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden}
.view{display:none}
.view.on{display:block}
.hint{color:var(--muted);font-size:12px;padding:10px 16px;border-top:1px solid var(--border);
  font-family:var(--mono)}

/* tree */
#tree{max-height:70vh;overflow:auto}
.row{display:flex;align-items:center;gap:8px;padding:4px 14px;border-bottom:1px solid var(--surface-2);
  cursor:pointer;white-space:nowrap}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--cat-reported-soft)}
.row .caret{width:16px;height:16px;flex:0 0 auto;color:var(--muted);display:inline-flex;
  align-items:center;justify-content:center;border-radius:4px}
.row .caret.leaf{visibility:hidden}
.row .caret:hover{background:var(--surface-3);color:var(--ink)}
.row .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.row .lbl{overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.row .lbl small{color:var(--muted);font-family:var(--mono);font-size:10.5px;margin-left:7px}
.row .cnt{font-family:var(--mono);font-size:12px;font-weight:500;flex:0 0 auto}
.row .cnt.reported{color:var(--cat-reported)}
.row .cnt.used_small{color:var(--cat-used-small)}
.row .cnt.zero{color:var(--muted)}
.row .col{width:7px;height:7px;border-radius:50%;background:var(--collision);flex:0 0 auto}
.kindtag{font-family:var(--mono);font-size:9.5px;color:var(--muted);border:1px solid var(--border);
  border-radius:4px;padding:0 4px;flex:0 0 auto}

/* prevalence bar (hierarchy rows) */
.pbar{width:94px;height:11px;flex:0 0 auto;border-radius:3px;background:var(--surface-2);
  position:relative;overflow:hidden;margin-left:2px;border:1px solid var(--border)}
.pbar .fill,.pbar .unc{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.pbar .unc{opacity:.30}
.pbar.small .fill{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.0),rgba(255,255,255,.0) 2px,rgba(255,255,255,.45) 2px,rgba(255,255,255,.45) 4px)}
.mode-t{margin-right:2px}
.mode-t button[aria-selected="true"]{color:var(--accent)}

/* treemap + table */
#treemap-wrap{padding:14px}
#treemap{width:100%;display:block;border-radius:8px;overflow:visible}
.tm-note{padding:0 16px 14px;color:var(--ink-2);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 14px;border-bottom:1px solid var(--surface-2);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);font-size:11px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);font-weight:600;cursor:pointer;z-index:1}
th:hover{color:var(--ink)}
td.num{font-family:var(--mono);text-align:right}
#table-scroll{max-height:70vh;overflow:auto}
tr.trow:hover{background:var(--surface-2);cursor:pointer}

/* graph body-system palette (Okabe-Ito, colorblind-safe) + descendant-highlight hue */
:root{--sys0:#0072B2;--sys1:#E69F00;--sys2:#009E73;--sys3:#CC79A7;--sys4:#D55E00;--sys5:#56B4E9;--desc:#2f6fed;--rare:#a1006b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --sys0:#4a97d6;--sys1:#f0a92a;--sys2:#2bbf9e;--sys3:#dd95c6;--sys4:#f0713a;--sys5:#8fd0f5;--desc:#6f9bff;--rare:#e77fc0}}
:root[data-theme="dark"]{--sys0:#4a97d6;--sys1:#f0a92a;--sys2:#2bbf9e;--sys3:#dd95c6;--sys4:#f0713a;--sys5:#8fd0f5;--desc:#6f9bff;--rare:#e77fc0}
.rare-tag{color:var(--rare);border:1px solid var(--rare);border-radius:4px;padding:0 4px;font-size:9.5px;font-family:var(--mono);flex:0 0 auto;letter-spacing:.03em}

/* graph (DAG explorer) */
#view-graph{position:relative}
.graph-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.g-hint{color:var(--muted);font-size:11.5px;font-family:var(--mono);margin-left:auto}
#graph{width:100%;height:72vh;display:block;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 1px 1px, var(--surface-2) 1.1px, transparent 0) 0 0/24px 24px}
#graph.grabbing{cursor:grabbing}
.gnode,.gmore{cursor:pointer;transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.gnode .gcirc{stroke:var(--surface);stroke-width:1.5;transition:r .4s cubic-bezier(.4,0,.2,1)}
.gnode.sel .gcirc{stroke:var(--accent);stroke-width:3}
.gnode .gring{transition:r .4s cubic-bezier(.4,0,.2,1)}
.gnode text{font-family:var(--sans);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
.gnode .glbl{fill:var(--ink);font-weight:600}
.gnode .gsub{fill:var(--ink-2);font-family:var(--mono)}
.gedge{fill:none;stroke:var(--ink-2);stroke-opacity:.5;stroke-width:1.5;stroke-linecap:round;
  transition:d .4s cubic-bezier(.4,0,.2,1),opacity .3s ease}
.gmore rect{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1.5}
.gmore text{fill:var(--ink-2);font-family:var(--mono);font-weight:600}
.gbadge{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.4}
.gbadge-sign{stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round;fill:none}
.grare{fill:var(--rare);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:2.6px;pointer-events:none}
/* lineage highlight: ancestors (accent) + descendants (--desc) stay lit, rest recede */
.sel-active .gnode:not(.hl):not(.hld){opacity:.2}
.sel-active .gmore{opacity:.2}
.sel-active .gedge:not(.hl):not(.hld){opacity:.06}
.gnode.hl .gcirc{stroke:var(--accent);stroke-width:2.6}
.gnode.hld .gcirc{stroke:var(--desc);stroke-width:2.4}
.gedge.hl{stroke:var(--accent);stroke-opacity:.95;stroke-width:2.4}
.gedge.hld{stroke:var(--desc);stroke-opacity:.9;stroke-width:2.2}
/* hover peek: same two-tone highlight as selection, transient */
.peek-active .gnode:not(.pk):not(.pkd){opacity:.2}
.peek-active .gmore{opacity:.2}
.peek-active .gedge:not(.pk):not(.pkd){opacity:.06}
.gnode.pk .gcirc{stroke:var(--accent);stroke-width:2.2}
.gnode.pkd .gcirc{stroke:var(--desc);stroke-width:2}
.gedge.pk{stroke:var(--accent);stroke-opacity:.9;stroke-width:2.1}
.gedge.pkd{stroke:var(--desc);stroke-opacity:.82;stroke-width:1.9}
.g-legend{display:flex;flex-wrap:wrap;gap:5px 13px;padding:7px 14px 10px;border-bottom:1px solid var(--border);font-size:11px;color:var(--ink-2)}
.g-legend .lg-item{display:flex;align-items:center;gap:5px}
.g-legend .lg-sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.g-focus-chip{display:none;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:20px;padding:3px 5px 3px 11px;font-size:12px;color:var(--ink);font-family:var(--mono)}
.g-focus-chip button{border:0;background:transparent;color:var(--ink-2);font-size:15px;line-height:1;padding:0 4px;cursor:pointer;border-radius:50%}
.g-focus-chip button:hover{color:var(--ink);background:var(--surface-3)}
@media(prefers-reduced-motion:reduce){.gnode,.gmore,.gedge,.gnode .gcirc,.gnode .gring{transition:none}}

/* drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(410px,92vw);background:var(--surface);
  border-left:1px solid var(--border);box-shadow:-14px 0 40px rgba(10,15,20,.14);
  transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:20;
  display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.drawer .dh h3{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2}
.drawer .close{border:0;background:var(--surface-2);border-radius:7px;width:30px;height:30px;
  color:var(--ink-2);font-size:17px;flex:0 0 auto}
.drawer .body{padding:16px 18px;overflow:auto}
.kv{display:grid;grid-template-columns:118px 1fr;gap:8px 12px;font-size:13px;margin-bottom:16px}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-word}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;
  font-size:12px;font-weight:600;font-family:var(--sans)}
.section-t{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin:4px 0 8px}
.chiplist{display:flex;flex-wrap:wrap;gap:6px}
.chiplist a,.chiplist span{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:6px;padding:3px 7px;text-decoration:none;color:var(--ink-2)}
.warn{background:var(--cat-used-small-soft);border:1px solid var(--cat-used-small);border-radius:9px;
  padding:10px 12px;font-size:12.5px;color:var(--ink);margin-bottom:14px;line-height:1.45}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;
  font-family:var(--mono);padding:6px 9px;border-radius:6px;z-index:40;opacity:0;transition:opacity .1s;max-width:280px}
.foot{margin-top:26px;color:var(--muted);font-size:11.5px;line-height:1.6;font-family:var(--mono)}
.foot b{color:var(--ink-2);font-weight:500}
</style>
</head>
<body data-palette="#009e93,#c9760a,#6a55d6,#9aa4b0">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="eyebrow">Ontology coverage &middot; All of Us</div>
      <h1>How much of Mondo does the EHR touch?</h1>
      <p>Every Mondo disease term that carries its own diagnosis code, counted by the patients coded <em>exactly</em> at that term — no roll-up. Mid-level and abstract terms keep their own count, so granularity stays visible.</p>
    </div>
    <div class="toolbar">
      <button class="btn" id="open-file" title="Open a mondo_usage.json produced by the cluster driver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6l2 3h8v11H4z"/></svg>Open data</button>
      <button class="btn" id="theme" title="Toggle theme" aria-label="Toggle color theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </div>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </header>

  <div class="source" id="source"></div>

  <section class="kpis" id="kpis"></section>
  <div class="cover" id="cover" role="img" aria-label="Coverage of mapped Mondo terms by usage category"></div>
  <div class="cover-legend" id="cover-legend"></div>

  <div class="controls">
    <div class="filters" id="filters"></div>
    <div class="grow"></div>
    <div class="tabs mode-t" id="mode" role="tablist" title="Per-term: each term's own exact-code count. Rolled up: subtree bracket [floor…ceiling] with aggregated uncertainty (overlap + suppression).">
      <button role="tab" data-mode="term" aria-selected="true">Per-term</button>
      <button role="tab" data-mode="rollup" aria-selected="false">Rolled up</button>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="search" type="search" placeholder="Search term or MONDO id…" autocomplete="off">
    </label>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="tree" aria-selected="true">Hierarchy</button>
      <button role="tab" data-view="graph" aria-selected="false">Graph</button>
      <button role="tab" data-view="treemap" aria-selected="false">Treemap</button>
      <button role="tab" data-view="table" aria-selected="false">Table</button>
    </div>
  </div>

  <div class="panel">
    <div class="view on" id="view-tree"><div id="tree"></div><div class="hint" id="tree-hint"></div></div>
    <div class="view" id="view-graph">
      <div class="graph-toolbar">
        <button class="btn sm" id="g-reset">Reset view</button>
        <button class="btn sm" id="g-collapse">Collapse all</button>
        <button class="btn sm" id="g-fit">Fit</button>
        <div class="tabs mode-t" id="gcolor" title="Node color: by top-level Mondo class (≈ body system), or by usage category">
          <button data-gc="system" aria-selected="true">System</button>
          <button data-gc="usage" aria-selected="false">Usage</button>
        </div>
        <span class="g-focus-chip" id="g-focus-chip"><span></span><button id="g-focus-clear" title="Clear focus" aria-label="Clear focus">×</button></span>
        <span class="g-hint" id="graph-hint"></span>
      </div>
      <div class="g-legend" id="g-legend"></div>
      <svg id="graph"></svg>
    </div>
    <div class="view" id="view-treemap"><div id="treemap-wrap"><svg id="treemap"></svg></div>
      <div class="tm-note" id="tm-note"></div></div>
    <div class="view" id="view-table"><div id="table-scroll"></div><div class="hint" id="table-hint"></div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<aside class="drawer" id="drawer" aria-hidden="true"><div id="drawer-inner"></div></aside>
<div class="tip" id="tip"></div>

<script id="mondo-data" type="application/json">null</script>
<script>
"use strict";
const CATS = [
  {key:"reported",   label:"Reported (≥20)",       color:"var(--cat-reported)",   on:true},
  {key:"used_small", label:"Used <20",              color:"var(--cat-used-small)", on:true},
  {key:"used_branch",label:"Used branch (0 count)", color:"var(--cat-used-branch)",on:true},
  {key:"other",      label:"Rest of Mondo",         color:"var(--cat-other)",      on:false},
];
const CATMAP = Object.fromEntries(CATS.map(c=>[c.key,c]));
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const fmt=n=>n==null?"":n.toLocaleString("en-US");
const lg=v=>v>0?Math.log(1+v):0;                       // log scale for prevalence bars
const fmtK=n=>{n=Math.round(n);return n<1000?(""+n):n<1e6?((n/1e3).toFixed(n<1e4?1:0)+"k"):((n/1e6).toFixed(1)+"M");};

// Roll-up nominal: a suppressed (<20) term contributes an unknown count in [1,19];
// SMALL_NOMINAL is the point estimate used for the "nominal add-up" only (the
// rigorous bracket uses 1 and 19 for floor/ceiling and never this value).
const SMALL_NOMINAL=10;
let DATA=null, byId=new Map(), kids=new Map(), dagKids=new Map(), roots=[], expanded=new Set(), selected=null;
let ROLL_MAX=1, OWN_MAX=1, ROLL_EST_MAX=1;
let graphOpen=new Set(["root"]), graphCap=new Map(), gz={x:24,y:24,k:0.85};
let gBounds=null;   // last-layout bounds for Fit
let gHL=new Set(), gHLD=new Set();  // selected + ancestors (hl) / visible descendants (hld)
let gFocus=null, gPeek=null, gCoord=new Map();
let gColorMode="system";            // "system" (by body system) | "usage" (by category)
const GRAPH_CAP=14;   // max children revealed per expansion before a "＋N more" node
const state={view:"tree",q:"",rollup:false,vis:new Set(CATS.filter(c=>c.on).map(c=>c.key))};

/* ---------- load: embedded block > fetched real > fetched sample ---------- */
async function boot(){
  let d=null;
  try{const raw=$("#mondo-data").textContent.trim(); if(raw&&raw!=="null") d=JSON.parse(raw);}catch(e){}
  if(!d) d=await tryFetch("mondo_usage.json");
  if(!d) d=await tryFetch("mondo_usage.sample.json");
  if(!d){document.querySelector(".panel").innerHTML=
    '<div class="hint">No data found. Use “Open data” to load a mondo_usage.json.</div>';return;}
  load(d);
}
async function tryFetch(u){try{const r=await fetch(u);if(!r.ok)return null;return await r.json();}catch(e){return null;}}

function load(d){
  DATA=d; byId=new Map(); kids=new Map(); dagKids=new Map(); roots=[]; expanded=new Set(); selected=null;
  for(const n of d.nodes) byId.set(n.id,n);
  for(const n of d.nodes){                        // spanning tree via primary parent
    const p=(n.parents&&n.parents.length)?n.parents[0]:null;
    if(p==null||n.kind==="root"){ if(n.kind!=="root") roots.push(n.id); continue; }
    if(!byId.has(p)){ roots.push(n.id); continue; }
    if(!kids.has(p)) kids.set(p,[]); kids.get(p).push(n.id);
  }
  // DAG child map: every parent->child edge (a node with N parents is a child of all
  // N). The Graph view expands along THIS, so a used term is reachable from every
  // Mondo parent — not only the one the spanning tree happened to pick.
  for(const n of d.nodes){ if(n.kind==="root")continue;
    for(const p of (n.parents||[])){ if(!byId.has(p))continue;
      if(!dagKids.has(p)) dagKids.set(p,[]); dagKids.get(p).push(n.id); } }
  // attach root's declared children too
  const rootNode=d.nodes.find(n=>n.kind==="root");
  if(rootNode&&kids.has(rootNode.id)) roots=roots.concat(kids.get(rootNode.id));
  roots=[...new Set(roots)];
  for(const [,arr] of kids) arr.sort(sortNodes);
  for(const [,arr] of dagKids) arr.sort(sortNodes);
  roots.sort(sortNodes);
  computeVisibleDesc(); computeRollup(); assignSystems();
  graphOpen=new Set(["root"]); graphCap=new Map(); gz={x:24,y:24,k:0.85}; gLayer=null; gBounds=null;
  gFocus=null; gHL=new Set(); gHLD=new Set(); gPeek=null;
  renderSource(); renderKPIs(); renderFilters();
  for(const id of roots) expanded.add(id);          // open first level
  renderAll();
}
function sortNodes(a,b){a=byId.get(a);b=byId.get(b);
  const ra=rank(a),rb=rank(b); if(ra!==rb)return ra-rb;
  const ca=a.count||0,cb=b.count||0; if(ca!==cb)return cb-ca;
  return a.label.localeCompare(b.label);}
const RANK={reported:0,used_small:1,used_branch:2,other:3,root:-1};
const rank=n=>RANK[n.category]??9;

/* a node shows if its own category is visible OR any descendant's is (so paths
   to used nodes stay navigable even when branch/other layers are toggled). */
function computeVisibleDesc(){
  const memo=new Map();
  function anyVis(id){
    if(memo.has(id))return memo.get(id);
    const n=byId.get(id); let v=state.vis.has(n.category);
    for(const c of (kids.get(id)||[])) v=anyVis(c)||v;
    memo.set(id,v); return v;
  }
  for(const id of byId.keys()) anyVis(id);
  DATA._anyVis=memo;
}

/* Roll-up aggregates over each node's (primary-parent) subtree. We only have
   per-term suppressed counts, so a subtree's true DISTINCT-patient coverage is
   bracketed, not exact:
     floor = largest single term    (>= this many distinct people — one term alone)
     ceil  = sum of terms, each <20 cell at 19  (<= this many — only if zero overlap)
   ceil-floor is the aggregated uncertainty (overlap/double-counting + suppression).
   est = a labeled nominal add-up (small terms at SMALL_NOMINAL). Multi-parent terms
   roll up under their primary parent only. */
function computeRollup(){
  const memo=new Map();
  function agg(id){
    if(memo.has(id))return memo.get(id);
    const n=byId.get(id);
    let R=n.state==="reported"?(n.count||0):0;         // Σ exact reported counts
    let s=n.state==="used_small"?1:0;                   // # suppressed (<20) terms
    let maxT=n.state==="reported"?(n.count||0):0;       // largest known term
    let nTerms=n.kind==="root"?0:1;
    let nUsed=(n.state==="reported"||n.state==="used_small")?1:0;
    let nColl=n.collision?1:0;
    for(const c of (kids.get(id)||[])){
      const a=agg(c); R+=a.R; s+=a.s; maxT=Math.max(maxT,a.maxT);
      nTerms+=a.nTerms; nUsed+=a.nUsed; nColl+=a.nColl;
    }
    const o={R,s,maxT,floor:maxT,ceil:R+19*s,est:R+SMALL_NOMINAL*s,nTerms,nUsed,nColl};
    memo.set(id,o); return o;
  }
  for(const id of byId.keys()) agg(id);
  DATA._roll=memo; ROLL_MAX=1; OWN_MAX=1; ROLL_EST_MAX=1;
  for(const n of DATA.nodes){ if(n.kind==="root")continue;
    ROLL_MAX=Math.max(ROLL_MAX,memo.get(n.id).ceil);
    ROLL_EST_MAX=Math.max(ROLL_EST_MAX,memo.get(n.id).est);
    if(n.state==="reported")OWN_MAX=Math.max(OWN_MAX,n.count);
  }
}

/* ---------------------------- data-source strip --------------------------- */
function renderSource(){
  const m=DATA.meta||{}, s=$("#source"); s.innerHTML="";
  const sample=/sample|synthetic/i.test((m.cdr||"")+(m.count_rule||"")+(m.mondo_version||""));
  if(sample){const b=el("span","badge-sample","SAMPLE DATA");s.appendChild(b);}
  const add=(k,v)=>{const w=el("span");w.innerHTML=`${k} <b>${v}</b>`;s.appendChild(w);};
  add("Mondo",m.mondo_version||"—"); add("CDR",m.cdr||"—");
  add("source",m.source_table||"—"); add("roll-up",m.rollup?"yes":"none (exact map)");
  add("floor","&lt;"+(m.min_cell||20)); add("generated",m.generated_utc||"—");
}

/* -------------------------------- KPIs ------------------------------------ */
function renderKPIs(){
  const s=DATA.stats, box=$("#kpis"); box.innerHTML="";
  const usedPct=(100*s.used_fraction).toFixed(1);
  const kpi=(label,value,sub,dot)=>{
    const k=el("div","kpi");
    const l=el("div","k-label"); if(dot){const d=el("span","dot");d.style.background=dot;l.appendChild(d);}
    l.appendChild(el("span",null,label)); k.appendChild(l);
    k.appendChild(el("div","k-value tnum",value));
    if(sub)k.appendChild(el("div","k-sub",sub)); box.appendChild(k); return k;
  };
  kpi("Mapped Mondo terms",fmt(s.mapped_terms),"disease terms with a diagnosis code").classList.add("span2");
  kpi("Used ≥1 patient",usedPct+"%",fmt(s.used_terms)+" terms touched in the EHR",CATMAP.reported.color);
  kpi("Reported (≥20)",fmt(s.reported_terms),"exact counts publishable",CATMAP.reported.color);
  kpi("Used-small (<20)",fmt(s.used_small_terms),"used, exact count withheld",CATMAP.used_small.color);
  kpi("Used branch points",fmt(s.used_branch_terms),"0 direct count, above used nodes",CATMAP.used_branch.color);
  kpi("Collision-flagged",fmt(s.collision_terms),"share a std concept with siblings",CATMAP.collision||"var(--collision)");
  if(s.rare_used_terms!=null)
    kpi("Rare used",fmt(s.rare_used_terms),"rare dx (GARD/Orphanet) coded in the EHR","var(--rare)");
  renderCover();
}
function renderCover(){
  const s=DATA.stats, bar=$("#cover"), leg=$("#cover-legend");
  const parts=[["reported",s.reported_terms],["used_small",s.used_small_terms],
    ["used_branch",s.used_branch_terms],["other",s.other_terms]];
  const tot=parts.reduce((a,[,v])=>a+v,0)||1;
  bar.innerHTML=""; leg.innerHTML="";
  for(const [k,v] of parts){
    const seg=el("span"); seg.style.width=(100*v/tot)+"%"; seg.style.background=CATMAP[k].color;
    seg.title=`${CATMAP[k].label}: ${fmt(v)}`; bar.appendChild(seg);
    const li=el("div","li"); const sw=el("span","dot");sw.style.background=CATMAP[k].color;
    li.appendChild(sw); li.appendChild(el("span",null,`${CATMAP[k].label} · ${fmt(v)}`)); leg.appendChild(li);
  }
}

/* ------------------------------- filters ---------------------------------- */
function renderFilters(){
  const f=$("#filters"); f.innerHTML="";
  const counts=catCounts();
  for(const c of CATS){
    const b=el("button","chip"); b.setAttribute("aria-pressed",state.vis.has(c.key));
    const sw=el("span","sw");sw.style.background=c.color;b.appendChild(sw);
    b.appendChild(el("span",null,c.label));
    b.appendChild(el("span","cnt tnum",fmt(counts[c.key]||0)));
    b.onclick=()=>{state.vis.has(c.key)?state.vis.delete(c.key):state.vis.add(c.key);
      b.setAttribute("aria-pressed",state.vis.has(c.key));computeVisibleDesc();renderAll();};
    f.appendChild(b);
  }
}
function catCounts(){const o={};for(const n of DATA.nodes){if(n.kind==="root")continue;o[n.category]=(o[n.category]||0)+1;}return o;}

/* ------------------------------- render ----------------------------------- */
function renderAll(){
  if(state.view==="tree")return renderTree();
  if(state.view==="graph")return renderGraph();
  if(state.view==="treemap")return renderTreemap();
  return renderTable();
}

/* ---- hierarchy ---- */
function renderTree(){
  const host=$("#tree"); host.innerHTML=""; const q=state.q.toLowerCase();
  let shown=0, matched=null;
  if(q){ matched=searchSet(q); }
  const frag=document.createDocumentFragment();
  const walk=(id,depth)=>{
    const n=byId.get(id);
    if(!DATA._anyVis.get(id)) return;
    if(matched && !matched.has(id)) return;
    const kidIds=(kids.get(id)||[]).filter(c=>DATA._anyVis.get(c)&&(!matched||matched.has(c)));
    const isOpen=expanded.has(id)|| (q&&matched);
    frag.appendChild(rowEl(n,depth,kidIds.length>0,isOpen)); shown++;
    if(isOpen) for(const c of kidIds) walk(c,depth+1);
  };
  for(const r of roots) walk(r,0);
  host.appendChild(frag);
  $("#tree-hint").textContent=state.rollup
    ? `${shown.toLocaleString()} rows · bar = subtree coverage [floor…ceiling]; number = distinct-patient bracket (overlap + <${DATA.meta.min_cell||20} suppression)`
    : `${shown.toLocaleString()} rows · bar = this term's own patients; counts are per-term, never summed`;
}
function rowEl(n,depth,hasKids,isOpen){
  const r=el("div","row"+(selected===n.id?" sel":"")); r.style.paddingLeft=(14+depth*17)+"px";
  const car=el("span","caret"+(hasKids?"":" leaf"));
  car.innerHTML=hasKids?(isOpen?"▾":"▸"):"";
  car.onclick=(e)=>{e.stopPropagation();expanded.has(n.id)?expanded.delete(n.id):expanded.add(n.id);renderTree();};
  r.appendChild(car);
  const sw=el("span","sw");sw.style.background=CATMAP[n.category]?CATMAP[n.category].color:"var(--muted)";r.appendChild(sw);
  const lbl=el("span","lbl");lbl.appendChild(document.createTextNode(n.label));
  const sm=el("small",null,n.id);lbl.appendChild(sm);r.appendChild(lbl);
  if(n.collision){const cd=el("span","col");cd.title="shares a standard concept with sibling terms";r.appendChild(cd);}
  if(n.kind==="internal"){const kt=el("span","kindtag","node");r.appendChild(kt);}
  if(n.rare){const rt=el("span","rare-tag","rare");rt.title="rare disease: "+((n.rare_src||[]).join(", ")||"Mondo");r.appendChild(rt);}
  r.appendChild(prevBar(n));
  const cs=countSpec(n);
  const cnt=el("span","cnt "+cs.cls,cs.text); if(cs.title)cnt.title=cs.title;
  r.appendChild(cnt);
  r.onclick=()=>select(n.id);
  return r;
}
function prevBar(n){
  const bar=el("span","pbar"), min=DATA.meta.min_cell||20;
  const w=f=>Math.min(100,Math.max(f>0?2:0,f*100))+"%";     // >=2% so tiny bars stay visible
  if(state.rollup){
    const r=DATA._roll.get(n.id); if(!r||r.nUsed===0)return bar;
    const denom=lg(ROLL_MAX);
    const unc=el("span","unc"); unc.style.width=w(lg(r.ceil)/denom); unc.style.background="var(--accent)";
    const fill=el("span","fill"); fill.style.width=w(lg(r.floor)/denom); fill.style.background="var(--accent)";
    bar.appendChild(unc); bar.appendChild(fill);
    bar.title=`subtree ${r.floor>0?fmt(r.floor):('<'+min)}–${fmt(r.ceil)} distinct patients`;
    return bar;
  }
  const denom=lg(OWN_MAX);
  if(n.state==="reported"){
    const fill=el("span","fill"); fill.style.width=w(lg(n.count)/denom);
    fill.style.background=CATMAP[n.category].color; bar.appendChild(fill);
  } else if(n.state==="used_small"){
    bar.classList.add("small");
    const fill=el("span","fill"); fill.style.width=w(lg(min-1)/denom);
    fill.style.background=CATMAP.used_small.color; bar.appendChild(fill); bar.title=`1–${min-1} (withheld)`;
  }
  return bar;
}
function countSpec(n){
  const min=DATA.meta.min_cell||20;
  if(state.rollup){
    const r=DATA._roll.get(n.id);
    if(!r||r.nUsed===0)return{cls:"zero",text:"0"};
    const fl=r.floor>0?fmtK(r.floor):("<"+min);
    return{cls:"reported",text:`${fl}–${fmtK(r.ceil)}`,
      title:`subtree distinct patients: ${r.floor>0?fmt(r.floor):('<'+min)} – ${fmt(r.ceil)}  ·  ${r.nUsed}/${r.nTerms} used, ${r.s} suppressed, ${r.nColl} collision  ·  nominal ≈ ${fmt(r.est)}`};
  }
  if(n.state==="reported")return{cls:"reported",text:fmt(n.count)};
  if(n.state==="used_small")return{cls:"used_small",text:"<"+min};
  return{cls:"zero",text:"0"};
}
function searchSet(q){                 // matched nodes + all their ancestors
  const keep=new Set();
  for(const n of DATA.nodes){
    if(n.kind==="root")continue;
    if(n.label.toLowerCase().includes(q)||n.id.toLowerCase().includes(q)){
      let cur=n.id;
      while(cur&&!keep.has(cur)){keep.add(cur);const p=byId.get(cur).parents[0];cur=(p&&byId.has(p))?p:null;}
    }
  }
  return keep;
}

/* ---- treemap (squarified, 2-level: body system → reported term) ---- */
function topAncestor(id){                // depth-1 ancestor (body system) of a node
  let cur=byId.get(id), guard=0;
  while(cur && cur.depth>1 && guard++<64){const p=cur.parents[0];cur=(p&&byId.has(p))?byId.get(p):null;}
  return cur?cur.id:id;
}
/* ---- graph (DAG node-link, horizontal layered, progressive disclosure) ---- */
// Body-system coloring: the top-6 depth-1 systems by rollup get an Okabe-Ito hue
// (colorblind-safe), the rest share a neutral. Drilling into one system then reads
// as a coherent hue family rather than a wall of teal.
const SYS_N=6;
function assignSystems(){
  const sys=DATA.nodes.filter(n=>n.depth===1)
    .sort((a,b)=>((DATA._roll.get(b.id)||{}).est||0)-((DATA._roll.get(a.id)||{}).est||0));
  DATA._sysIdx=new Map(); sys.slice(0,SYS_N).forEach((n,i)=>DATA._sysIdx.set(n.id,i));
}
function systemFill(id){
  if(!DATA._sysIdx) return "var(--cat-other)";
  const s=topAncestor(id), i=DATA._sysIdx.get(s);
  return i==null?"var(--cat-other)":`var(--sys${i})`;
}
function nodeFill(id,n){
  return gColorMode==="system" ? systemFill(id)
    : (CATMAP[n.category]?CATMAP[n.category].color:"var(--muted)");
}
const nodeOpac=n=>n.state==="reported"?0.92:n.state==="used_small"?0.62:0.34;

const gval=id=>{const n=byId.get(id); if(!n)return 0;
  if(state.rollup){const r=DATA._roll.get(id);return r?r.est:0;}
  return n.state==="reported"?n.count:n.state==="used_small"?((DATA.meta.min_cell||20)-1):0.4;};
function graphCountText(id){const n=byId.get(id),min=DATA.meta.min_cell||20;
  if(state.rollup){const r=DATA._roll.get(id); if(!r||r.nUsed===0)return "";
    return `${r.floor>0?fmtK(r.floor):('<'+min)}–${fmtK(r.ceil)}`;}
  return n.state==="reported"?fmtK(n.count):n.state==="used_small"?("<"+min):"";}

// visible node set: root + capped top-prevalence children of open nodes; a truncated
// fan-out gets a synthetic "more:<parent>" node. Search overrides with matched∪ancestors.
function graphVisible(){
  const vis=new Map(), q=state.q.toLowerCase();
  const canShow=id=>{const n=byId.get(id);return !!n&&(n.kind==="root"||DATA._anyVis.get(id));};
  if(q){const keep=searchSet(q); for(const id of keep) if(canShow(id)) vis.set(id,byId.get(id));
    if(byId.get("root"))vis.set("root",byId.get("root")); return vis;}
  const seeds=(gFocus&&byId.has(gFocus))?[gFocus]:(byId.get("root")?["root"]:roots);
  for(const s of seeds) if(canShow(s)) vis.set(s,byId.get(s));
  let changed=true;
  while(changed){changed=false;
    for(const id of [...vis.keys()]){
      if(id.startsWith("more:")||!graphOpen.has(id))continue;
      const ch=(dagKids.get(id)||[]).filter(canShow).sort((a,b)=>gval(b)-gval(a));
      const cap=graphCap.get(id)??GRAPH_CAP;
      let show=ch, hiddenN=0, sortv=0;
      if(ch.length>cap){                       // show the top few AND the bottom few,
        const T=Math.max(1,Math.ceil(cap*0.6)), B=Math.max(1,cap-T);  // "more" between
        show=[...ch.slice(0,T),...ch.slice(ch.length-B)];
        hiddenN=ch.length-show.length;
        sortv=(gval(ch[T-1])+gval(ch[ch.length-B]))/2;
      }
      for(const c of show) if(!vis.has(c)){vis.set(c,byId.get(c));changed=true;}
      const mid="more:"+id;
      if(hiddenN>0 && !vis.has(mid)){
        vis.set(mid,{id:mid,_more:true,parent:id,hidden:hiddenN,sortv,
          label:`＋${hiddenN} more`,depth:(byId.get(id).depth||0)+1}); changed=true;
      }
    }
  }
  // reveal ancestor lineage: for the focus node (context of where it sits) and for
  // the selected node (every parent path to root).
  for(const anchor of [gFocus,selected]){
    if(anchor && byId.has(anchor)){
      const anc=ancestorSet(anchor); anc.add(anchor);
      for(const id of anc) if(canShow(id)&&!vis.has(id)) vis.set(id,byId.get(id));
    }
  }
  return vis;
}
function descendantSet(id){               // DAG descendants (every child edge)
  const out=new Set(), st=[...(dagKids.get(id)||[])];
  while(st.length){const c=st.pop(); if(out.has(c))continue; out.add(c); for(const cc of (dagKids.get(c)||[]))st.push(cc);}
  return out;
}
const gparents=(vis,id)=>{const n=vis.get(id); return n._more?[n.parent]:((n.parents||[]).filter(p=>vis.has(p)));};
function ancestorSet(id){                 // all transitive parents up the DAG (every path)
  const out=new Set(), st=[...((byId.get(id)||{}).parents||[])];
  while(st.length){const p=st.pop(); if(out.has(p)||!byId.has(p))continue; out.add(p);
    for(const pp of (byId.get(p).parents||[])) st.push(pp);}
  return out;
}
// radius: area ∝ value against a STABLE global max (√ scale), so 20k / 5k / <20
// read as clearly different sizes and don't rescale as you expand.
function graphRadius(id){
  if(byId.get(id)===undefined) return 7;               // more-node
  const maxV=state.rollup?ROLL_EST_MAX:OWN_MAX;
  return 8+46*Math.sqrt(Math.max(gval(id),0)/(maxV||1));
}
function layoutGraph(vis){
  const layers={}; let maxD=0;
  for(const [id,n] of vis){const d=n.depth||0;(layers[d]=layers[d]||[]).push(id);maxD=Math.max(maxD,d);}
  const rad=id=>vis.get(id)._more?8:graphRadius(id);
  const lab=id=>vis.get(id).label||"";
  // STABLE ordering: each layer sorted by size (desc), tie-break by label. Does not
  // depend on positions, so expanding/collapsing never reshuffles the survivors.
  const coord=new Map(); let x=40; const gap=26;
  for(let d=0;d<=maxD;d++){
    const arr=(layers[d]||[]).slice().sort((a,b)=>{
      const am=vis.get(a)._more?vis.get(a).sortv:gval(a);
      const bm=vis.get(b)._more?vis.get(b).sortv:gval(b);
      return (bm-am)|| (lab(a)<lab(b)?-1:1);
    });
    const maxR=Math.max(14,...arr.map(rad));
    let H=0; for(const id of arr) H+=2*rad(id)+gap; H=Math.max(0,H-gap);
    let y=-H/2;                               // center each column around y=0

function squarify(values,rect){         // returns array of {x,y,w,h} aligned to values

  let rest=items.slice();

    const s=row.reduce((a,r)=>a+r.v,0); const horizontal=w>=h;

      <div class="section-t">${n.kind} term · depth ${n.depth}</div>
      <h3>${esc(n.label)}</h3></div>
      <div style="display:flex;gap:6px">
      <button class="close" id="dfocus" title="Focus this node in the graph" aria-label="Focus in graph" style="font-size:15px">⌖</button>
      <button class="close" aria-label="Close">×</button></div></div><div class="body">`;
  html+=`<span class="pill" style="color:${cat.color};background:color-mix(in srgb,${cat.color} 15%,transparent)">${cat.label}</span>`;
  if(n.rare) html+=` <span class="pill" style="color:var(--rare);background:color-mix(in srgb,var(--rare) 15%,transparent)" title="Mondo rare-disease designation">✦ rare · ${(n.rare_src||["Mondo"]).join(", ")}</span>`;
  if(n.collision) html+=`<div class="warn" style="margin-top:12px"><b>Multi-mapping.</b> This term shares a standard concept with ${n.collision_siblings.length} sibling term(s) via OMOP <span class="mono">Maps&nbsp;to</span>. Its count includes those shared patients — do not sum across the flagged terms.</div>`;
  html+=`<dl class="kv" style="margin-top:14px">
    <dt>Patients</dt><dd style="font-size:15px;color:${n.state==="reported"?cat.color:"var(--ink)"}">${disp}</dd>
    <dt>MONDO id</dt><dd>${purl?`<a href="${purl}" target="_blank" rel="noopener">${n.id}</a>`:n.id}</dd>
    <dt>Std concepts</dt><dd>${(n.std_concepts||[]).map(c=>`<a href="https://athena.ohdsi.org/search-terms/terms/${c}" target="_blank" rel="noopener">${c}</a>`).join(", ")||"—"}</dd>
  </dl>`;
  const rr=DATA._roll&&DATA._roll.get(id);
  if(rr && (kids.get(id)||[]).length){
    const fl=rr.floor>0?fmt(rr.floor):("&lt; "+min);
    html+=`<div class="section-t">Subtree roll-up (estimate)</div>
      <div class="warn" style="background:var(--surface-2);border-color:var(--border);color:var(--ink-2)">
        Distinct patients across this subtree lie in
        <b style="color:var(--ink)">${fl} – ${fmt(rr.ceil)}</b>.
        <b>Floor</b> = the single largest term (at least this many distinct people).
        <b>Ceiling</b> = the sum of its ${rr.nUsed} used term(s), each &lt;${min} cell counted as ${min-1},
        reached only with zero overlap.${rr.nColl?` <b>${rr.nColl}</b> term(s) here share a standard concept — extra double-count risk.`:""}
        Nominal add-up ≈ <b style="color:var(--ink)">${fmt(rr.est)}</b>.
      </div>
      <dl class="kv"><dt>Used terms</dt><dd>${fmt(rr.nUsed)} of ${fmt(rr.nTerms)}</dd>
        <dt>Suppressed</dt><dd>${fmt(rr.s)} term(s) &lt;${min}</dd>
        <dt>Collisions</dt><dd>${fmt(rr.nColl)}</dd></dl>`;
  }
  const parents=(n.parents||[]).filter(p=>byId.has(p));
  html+=`<div class="section-t">Parents (${parents.length})</div><div class="chiplist">`+
    (parents.length?parents.map(p=>`<a data-goto="${p}">${esc(byId.get(p).label)}</a>`).join(""):`<span>root</span>`)+`</div>`;
  const ch=(dagKids.get(id)||[]);
  if(ch.length){html+=`<div class="section-t" style="margin-top:16px">Children (${ch.length})</div><div class="chiplist">`+
    ch.slice(0,40).map(c=>`<a data-goto="${c}">${esc(byId.get(c).label)}</a>`).join("")+
    (ch.length>40?`<span>+${ch.length-40} more</span>`:"")+`</div>`;}
  if(n.collision&&n.collision_siblings.length){html+=`<div class="section-t" style="margin-top:16px">Collision siblings</div><div class="chiplist">`+
    n.collision_siblings.slice(0,30).map(c=>byId.has(c)?`<a data-goto="${c}">${esc(byId.get(c).label)}</a>`:`<span>${c}</span>`).join("")+`</div>`;}
  html+=`</div>`;
  inner.innerHTML=html; dr.classList.add("open"); dr.setAttribute("aria-hidden","false");
  inner.querySelector(".close[aria-label='Close']").onclick=closeDrawer;
  const df=inner.querySelector("#dfocus"); if(df) df.onclick=()=>{
    if(state.view!=="graph"){document.querySelector('.tabs:not(.mode-t) button[data-view=graph]').click();}
    focusNode(id);};
  inner.querySelectorAll("[data-goto]").forEach(a=>a.onclick=()=>{const t=a.getAttribute("data-goto");revealInTree(t);select(t);});
  if(state.view==="tree"){renderTree();}
  else if(state.view==="table"){renderTable();}
  else if(state.view==="graph"){renderGraph(); if(!fromFocus) centerNodeInView(id);}
}
function revealInTree(id){let cur=id;const path=[];while(cur){const n=byId.get(cur);if(!n)break;path.push(cur);const p=n.parents[0];cur=(p&&byId.has(p))?p:null;}
  for(const p of path)expanded.add(p);}
function closeDrawer(){selected=null;$("#drawer").classList.remove("open");$("#drawer").setAttribute("aria-hidden","true");
  if(state.view==="tree")renderTree();else if(state.view==="table")renderTable();else if(state.view==="graph")renderGraph();}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clip=(s,n)=>s.length>n?s.slice(0,n-1)+"…":s;

/* --------------------------------- svg utils ------------------------------ */
function svgEl(t,attrs){const e=document.createElementNS("http://www.w3.org/2000/svg",t);
  for(const k in attrs)e.setAttribute(k,attrs[k]);return e;}
function svgText(x,y,txt,fill,weight,size,op,fam){const t=svgEl("text",{x,y,fill,
  "font-family":fam||"var(--sans)","font-weight":weight||"500","font-size":size||11,
  "fill-opacity":op==null?1:op,"pointer-events":"none"});t.textContent=txt;return t;}
const tip=$("#tip");
function showTip(e,txt){tip.textContent=txt;tip.style.opacity=1;
  tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+"px";tip.style.top=(e.clientY+14)+"px";}
function hideTip(){tip.style.opacity=0;}

/* --------------------------------- wiring --------------------------------- */
document.querySelectorAll(".tabs:not(.mode-t) button").forEach(b=>b.onclick=()=>{
  state.view=b.dataset.view;
  document.querySelectorAll(".tabs:not(.mode-t) button").forEach(x=>x.setAttribute("aria-selected",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("#view-"+state.view).classList.add("on"); renderAll();
  if(state.view==="graph") requestAnimationFrame(graphFit);
});
// graph controls + pan/zoom (listeners on the persistent svg, once)
$("#g-collapse").onclick=()=>{graphOpen=new Set(["root"]);graphCap=new Map();gFocus=null;selected=null;closeDrawer();renderGraph();requestAnimationFrame(graphFit);};
$("#g-reset").onclick=()=>{gFocus=null;renderGraph();gz={x:24,y:24,k:0.85};if(gLayer)applyGT(gLayer);};
$("#g-fit").onclick=graphFit;
$("#g-focus-clear").onclick=()=>clearFocus();
document.querySelectorAll("#gcolor button").forEach(b=>b.onclick=()=>{
  gColorMode=b.dataset.gc;
  document.querySelectorAll("#gcolor button").forEach(x=>x.setAttribute("aria-selected",x===b));
  renderGraph();});
(function(){const svg=$("#graph");let drag=null;
  svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top,f=Math.exp(-e.deltaY*0.0016);
    const nk=Math.min(3,Math.max(0.12,gz.k*f));
    gz.x=mx-(mx-gz.x)*(nk/gz.k);gz.y=my-(my-gz.y)*(nk/gz.k);gz.k=nk;
    const g=svg.firstChild;if(g)applyGT(g);},{passive:false});
  svg.addEventListener("pointerdown",e=>{if(e.target.closest(".gnode,.gmore"))return;
    drag={x:e.clientX,y:e.clientY,ox:gz.x,oy:gz.y,moved:false};svg.classList.add("grabbing");
    try{svg.setPointerCapture(e.pointerId);}catch(_){}});
  svg.addEventListener("pointermove",e=>{if(!drag)return;
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;
    gz.x=drag.ox+(e.clientX-drag.x);gz.y=drag.oy+(e.clientY-drag.y);
    const g=svg.firstChild;if(g)applyGT(g);});
  const end=()=>{
    if(drag&&!drag.moved&&selected){closeDrawer();}   // background click clears selection + dimming
    drag=null;svg.classList.remove("grabbing");};
  svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
})();
document.querySelectorAll("#mode button").forEach(b=>b.onclick=()=>{
  state.rollup=b.dataset.mode==="rollup";
  document.querySelectorAll("#mode button").forEach(x=>x.setAttribute("aria-selected",x===b));
  renderAll();
  if(selected && $("#drawer").classList.contains("open")) select(selected);
});
let searchT; $("#search").addEventListener("input",e=>{clearTimeout(searchT);
  searchT=setTimeout(()=>{state.q=e.target.value.trim();renderAll();},130);});
$("#open-file").onclick=()=>$("#file").click();
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();rd.onload=()=>{try{load(JSON.parse(rd.result));}catch(err){alert("Could not parse JSON: "+err.message);}};rd.readAsText(f);});
$("#theme").onclick=()=>{const r=document.documentElement;
  const cur=r.getAttribute("data-theme")|| (matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  const next=cur==="dark"?"light":"dark"; r.setAttribute("data-theme",next);
  try{localStorage.setItem("mondo-theme",next);}catch(e){} if(state.view==="treemap")renderTreemap();};
try{const saved=localStorage.getItem("mondo-theme");if(saved)document.documentElement.setAttribute("data-theme",saved);}catch(e){}
addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(state.view==="treemap")renderTreemap();},150);});
$("#foot").innerHTML=`<b>Method.</b> One Mondo term = one OMOP standard Condition concept it maps to via <span class="mono">same_as → Maps to</span>; a term's count is the distinct persons coded <b>exactly</b> at that concept — no <span class="mono">concept_ancestor</span> roll-up. A person is counted once per term; comorbidities appear under each distinct term. Counts of 1–${19} are shown as <b>&lt;20</b> (AoU small-cell rule); only per-term floored counts are published, so nothing can be differenced back. Term counts in the KPIs are counts of terms, not patients, and are exact. <b>Rolled up</b> brackets a subtree's distinct patients in <b>[floor, ceiling]</b> — floor = its largest single term, ceiling = the sum with each &lt;20 cell at 19 — so the interval width carries both the double-counting (overlap) and the suppression uncertainty; the sum is an upper bound, never a distinct-patient total.`;

boot();
</script>
</body>
</html>
